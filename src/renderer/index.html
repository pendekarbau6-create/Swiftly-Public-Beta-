<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self';">
  <title>Swiftly</title>
  <link rel="stylesheet" href="css/shell.css">
</head>
<body>
  <div id="chrome">
    <div id="tabstrip">
      <div id="tabs" role="tablist" aria-label="Open tabs"></div>
      <button id="new-tab" class="icon-button" title="New tab (Ctrl+T)" aria-label="New tab">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      </button>

      <div class="window-controls" aria-label="Window controls">
        <button id="win-minimize" class="win-control" title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg>
        </button>
        <button id="win-maximize" class="win-control" title="Maximize" aria-label="Maximize">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button id="win-close" class="win-control win-close" title="Close" aria-label="Close">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
    </div>

    <div id="toolbar">
      <div class="nav-group">
        <button id="nav-back" class="icon-button" title="Back (Alt+←)" aria-label="Back" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
        </button>
        <button id="nav-forward" class="icon-button" title="Forward (Alt+→)" aria-label="Forward" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
        </button>
        <button id="nav-reload" class="icon-button" title="Reload (Ctrl+R)" aria-label="Reload">
          <svg class="icon-reload" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.9-4.2"/>
            <path d="M13.2 1.6v3.1h-3.1"/>
          </svg>
          <svg class="icon-stop" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5"/></svg>
        </button>
        <button id="nav-home" class="icon-button" title="Home (Alt+Home)" aria-label="Home">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5L8 2.5l5.5 5"/><path d="M4 7v6.5h8V7"/></svg>
        </button>
      </div>

      <div id="omnibox" role="combobox" aria-expanded="false" aria-haspopup="menu">
        <span id="omnibox-icon" aria-hidden="true">
          <svg class="icon-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
          <svg class="icon-lock" viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
          <svg class="icon-warning" viewBox="0 0 16 16"><path d="M8 2l6 11H2z"/><path d="M8 6.5v3M8 11.6v.1"/></svg>
        </span>
        <input id="omnibox-input" type="text" spellcheck="false" autocomplete="off"
               autocapitalize="off" aria-label="Address and search bar" placeholder="Search or enter address">
        <button id="omnibox-suggestions" class="icon-button" title="Show suggestions" aria-label="Show suggestions">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
        </button>
        <button id="omnibox-star" class="icon-button" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>
        </button>
      </div>

      <button id="privacy-shield" class="icon-button" type="button" aria-label="Privacy Shield" aria-pressed="false" title="Privacy Shield">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 13 3.4v4.1c0 3.1-2 5.7-5 7-3-1.3-5-3.9-5-7V3.4z"/><path d="m5.5 7.8 1.7 1.7 3.4-3.6"/></svg>
      </button>
      <button id="reader-button" class="icon-button" type="button" title="Speed Reader" aria-label="Toggle Speed Reader" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h7.5L13 5v8.5H3z"/><path d="M10.5 2.5V5H13M5 7h6M5 9h6M5 11h4"/></svg>
      </button>

      <button id="zoom-indicator" class="zoom-indicator" title="Reset zoom (Ctrl+0)" aria-label="Zoom level" hidden></button>

      <button id="menu-button" class="icon-button" title="Swiftly menu" aria-label="Swiftly menu">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="13" cy="8" r="1.3"/></svg>
      </button>
    </div>

    <div id="bookmarkbar" hidden>
      <div id="bookmarks" role="list" aria-label="Bookmarks bar"></div>
      <button id="bookmarks-manage" class="bar-button" type="button" title="Manage bookmarks">Manage</button>
    </div>

    <div id="findbar" hidden>
      <input id="find-input" type="text" placeholder="Find in page" aria-label="Find in page">
      <span id="find-count"></span>
      <button id="find-prev" class="icon-button" aria-label="Previous match">
        <svg viewBox="0 0 16 16"><path d="M4 10l4-4 4 4"/></svg>
      </button>
      <button id="find-next" class="icon-button" aria-label="Next match">
        <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>
      </button>
      <button id="find-close" class="icon-button" aria-label="Close find bar">
        <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <!-- Startup overlay for cinematic fade-in -->
  <div id="startup-overlay"></div>

  <script src="js/shell.js"></script>
</body>
</html>
