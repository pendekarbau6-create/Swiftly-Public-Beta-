<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self';">
  <title>Speed Reader — Swiftly</title>
  <link rel="stylesheet" href="assets/pages.css">
</head>
<body>
  <main class="reader-page">
    <header class="reader-toolbar">
      <div>
        <div class="reader-label">Swiftly Speed Reader</div>
        <div class="reader-source" id="reader-source"></div>
      </div>
      <div class="reader-controls">
        <button class="button" id="font-smaller" type="button" aria-label="Decrease text size">A−</button>
        <button class="button" id="font-larger" type="button" aria-label="Increase text size">A+</button>
        <button class="button" id="reader-close" type="button">Return to page</button>
      </div>
    </header>
    <article class="reader-article" id="reader-article">
      <p class="page-subtitle">Preparing readable text…</p>
    </article>
  </main>
  <script src="assets/common.js"></script>
  <script src="assets/reader.js"></script>
</body>
</html>
