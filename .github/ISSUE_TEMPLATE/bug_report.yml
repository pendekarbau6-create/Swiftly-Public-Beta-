name: Bug report
description: Report a reproducible problem with Swiftly
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Before submitting, check whether this issue has already been reported.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the steps that reliably reproduce the problem.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Swiftly version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: "Windows 11"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove personal data and secrets before sharing.
    validations:
      required: false
